[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secondhand-wechat-notifier"
version = "0.1.0"
description = "Generic HTTP JSON data source to WeChat group notifier for macOS."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Secondhand WeChat Notifier Contributors"}]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
mac = [
  "Pillow>=9.0",
  "pyobjc-core>=9.0",
  "pyobjc-framework-Cocoa>=9.0",
  "pyobjc-framework-Quartz>=9.0",
  "pyobjc-framework-ApplicationServices>=9.0",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
wechat-notifier = "notifier.cli:main"

[tool.setuptools.packages.find]
include = ["notifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
